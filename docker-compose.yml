services:
  # PocketBase: comptes (OAuth2), CV, routes /jr/*, interface.
  app:
    image: ${JOBRADAR_IMAGE:-ghcr.io/lilyanlefevre/jobradar:latest}
    build: server
    restart: unless-stopped
    environment:
      WORKER_URL: http://worker:5055
      WORKER_SECRET: ${WORKER_SECRET:?set WORKER_SECRET in .env}
      SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST:-}
      ADMIN_PUBLIC: ${ADMIN_PUBLIC:-}
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "${JOBRADAR_BIND:-127.0.0.1}:${JOBRADAR_PORT:-8090}:8090"
    volumes:
      - ./pb_data:/pb/pb_data # comptes, CV, clés API chiffrées: à sauvegarder
    depends_on:
      - worker

  # JobSpy + évaluation Claude. Réseau interne uniquement.
  worker:
    image: ${JOBRADAR_WORKER_IMAGE:-ghcr.io/lilyanlefevre/jobradar-worker:latest}
    build: worker
    restart: unless-stopped
    environment:
      WORKER_SECRET: ${WORKER_SECRET:?set WORKER_SECRET in .env}
      SECRETS_KEY: ${SECRETS_KEY:?set SECRETS_KEY in .env}
      JOBRADAR_MODEL: ${JOBRADAR_MODEL:-}
      SEARCHES_PER_DAY: ${SEARCHES_PER_DAY:-10}
    # Durcissement: utilisateur non-root (Dockerfile), système de fichiers en lecture seule, aucune capacité.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  # Optionnel: tunnel Cloudflare (profil "tunnel"); route à créer dans le tableau de bord Cloudflare vers http://app:8090
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-} # requis avec COMPOSE_PROFILES=tunnel
    depends_on:
      - app
