<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobRadar</title>
<style>
:root{--bg:#0e1116;--panel:#161b22;--line:#252c36;--text:#e6e9ee;--mute:#8b95a5;--acc:#6ee7b7;--bad:#f87171;--mid:#fbbf24}
@media (prefers-color-scheme: light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6ea;--text:#14181f;--mute:#667085;--acc:#0f9d6e;--bad:#dc2626;--mid:#d97706}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,sans-serif;display:grid;grid-template-columns:320px 380px 1fr;height:100vh}
aside,section,main{overflow:auto;padding:18px;border-right:1px solid var(--line)}
main{border:0}
h1{font-size:18px;margin:0 0 14px;letter-spacing:-.02em}
h1 span{color:var(--acc)}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:20px 0 8px}
label{display:block;font-size:12px;color:var(--mute);margin:10px 0 4px}
input,textarea,select{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
textarea{height:200px;resize:vertical;font-size:12px}
input:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row{display:flex;gap:8px}.row>*{flex:1}
.chk{display:flex;gap:12px;margin-top:8px}.chk label{display:flex;gap:4px;align-items:center;margin:0;color:var(--text)}.chk input{width:auto}
button{background:var(--acc);color:#04130c;border:0;border-radius:8px;padding:9px 14px;font:600 14px system-ui;cursor:pointer;width:100%;margin-top:14px}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);margin-top:6px}
button:disabled{opacity:.5;cursor:wait}
.job{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;gap:12px;align-items:center}
.job:hover,.job.on{border-color:var(--acc)}
.job b{display:block}.job small{color:var(--mute)}
.score{min-width:46px;text-align:center;font:700 18px ui-monospace,monospace}
.score i{display:block;font:400 10px system-ui;color:var(--mute)}
.hi{color:var(--acc)}.md{color:var(--mid)}.lo{color:var(--bad)}
.bars{display:flex;gap:24px;margin:12px 0}
.bars div{font:700 34px ui-monospace,monospace}.bars small{display:block;font:400 11px system-ui;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0;font-size:13px}
.diff p{margin:0;padding:8px;border-radius:6px}.old{background:#f871711a}.new{background:#6ee7b71a}
ul{margin:4px 0;padding-left:18px}
a{color:var(--acc)}
.mute{color:var(--mute)}
details{margin-top:14px}pre{white-space:pre-wrap;font:12px/1.5 inherit;color:var(--mute)}
@media(max-width:1000px){body{display:block;height:auto}}
</style>
</head>
<body>
<aside>
  <h1>Job<span>Radar</span></h1>
  <label>Poste</label><input id="q" placeholder="développeur web">
  <label>Lieu</label><input id="loc" placeholder="Lyon, France">
  <div class="row">
    <div><label>Résultats / site</label><input id="n" type="number" value="15" min="1" max="50"></div>
    <div><label>Âge max</label><select id="hours"><option value="24">24 h</option><option value="72">3 j</option><option value="168" selected>7 j</option><option value="720">30 j</option></select></div>
  </div>
  <div class="chk">
    <label><input type="checkbox" class="site" value="indeed" checked>Indeed</label>
    <label><input type="checkbox" class="site" value="linkedin" checked>LinkedIn</label>
    <label><input type="checkbox" class="site" value="glassdoor">Glassdoor</label>
  </div>
  <h2>Mon CV (texte / markdown)</h2>
  <textarea id="cv" placeholder="Collez votre CV ici"></textarea>
  <button class="ghost" id="saveCv">Enregistrer le CV</button>
  <button id="go">Chercher et évaluer</button>
  <p class="mute" id="status"></p>
</aside>
<section id="list"><p class="mute">Lancez une recherche.</p></section>
<main id="detail"><p class="mute">Sélectionnez une offre.</p></main>

<script>
const $ = s => document.querySelector(s);
const jobs = {};
let selected = null;
const cls = n => n >= 70 ? 'hi' : n >= 45 ? 'md' : 'lo';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = (u, m, b) => fetch(u, {method: m, headers: {'Content-Type': 'application/json'}, body: b && JSON.stringify(b)}).then(r => r.json());

fetch('/api/cv').then(r => r.json()).then(d => $('#cv').value = d.cv);
$('#saveCv').onclick = async () => { await api('/api/cv', 'PUT', {cv: $('#cv').value}); $('#status').textContent = 'CV enregistré.'; };

$('#go').onclick = async () => {
  if (!$('#q').value.trim() || !$('#cv').value.trim()) return $('#status').textContent = 'Poste et CV requis.';
  $('#go').disabled = true;
  await api('/api/cv', 'PUT', {cv: $('#cv').value});
  $('#status').textContent = 'Recherche en cours (30 s environ)…';
  const res = await api('/api/search', 'POST', {
    query: $('#q').value, location: $('#loc').value, n: $('#n').value, hours: $('#hours').value,
    sites: [...document.querySelectorAll('.site:checked')].map(e => e.value)});
  $('#go').disabled = false;
  if (!res.jobs) return $('#status').textContent = 'Erreur de recherche.';
  Object.keys(jobs).forEach(k => delete jobs[k]);
  res.jobs.forEach(j => jobs[j.id] = j);
  render();
  evaluateAll(res.jobs);
};

async function evaluateAll(list) {
  let done = 0;
  const queue = [...list];
  const worker = async () => {
    while (queue.length) {
      const j = queue.shift();
      const r = await api('/api/evaluate', 'POST', j).catch(e => ({error: String(e)}));
      jobs[j.id].ev = r;
      $('#status').textContent = `Évaluation ${++done}/${list.length}`;
      render();
    }
  };
  await Promise.all([worker(), worker(), worker()]);
  $('#status').textContent = 'Terminé.';
}

function render() {
  const sorted = Object.values(jobs).sort((a, b) => (b.ev?.match ?? -1) - (a.ev?.match ?? -1));
  $('#list').innerHTML = sorted.map(j => `
    <div class="job ${j.id === selected ? 'on' : ''}" data-id="${esc(j.id)}">
      <div class="score ${cls(j.ev?.match)}">${j.ev?.match ?? (j.ev?.error ? '!' : '…')}<i>match</i></div>
      <div><b>${esc(j.titre)}</b><small>${esc(j.entreprise)} · ${esc(j.lieu)} · ${esc(j.site)}</small></div>
    </div>`).join('');
  document.querySelectorAll('.job').forEach(e => e.onclick = () => { selected = e.dataset.id; render(); }) ;
  if (selected) detail(jobs[selected]);
}

function detail(j) {
  const e = j.ev;
  let body = '<p class="mute">Évaluation en cours…</p>';
  if (e?.error) body = `<p class="lo">${esc(e.error)}</p>`;
  else if (e) body = `
    <div class="bars">
      <div class="${cls(e.match)}">${e.match}<small>Match profil / offre</small></div>
      <div class="${cls(e.cv_score)}">${e.cv_score}<small>CV pour cette offre</small></div>
    </div>
    <p>${esc(e.verdict)}</p>
    <h2>Forces</h2><ul>${(e.forces || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h2>Manques</h2><ul>${(e.manques || []).map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    <h2>Modifications proposées</h2>
    ${(e.modifs || []).map(m => `<div class="card"><b>${esc(m.section)}</b>
      <div class="diff"><p class="old">${esc(m.avant)}</p><p class="new">${esc(m.apres)}</p></div>
      <small class="mute">${esc(m.pourquoi)}</small></div>`).join('')}`;
  $('#detail').innerHTML = `<h1>${esc(j.titre)}</h1>
    <p class="mute">${esc(j.entreprise)} · ${esc(j.lieu)} · <a href="${esc(j.url)}" target="_blank" rel="noopener">Voir l'offre</a></p>
    ${body}<details><summary>Description de l'offre</summary><pre>${esc(j.description)}</pre></details>`;
}
</script>
</body>
</html>
