<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JobRadar</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" hidden>
  <div class="brand">Job<span>Radar</span></div>
  <p class="muted">Trouvez des offres et sachez, pour chacune, comment adapter votre CV.</p>
  <div id="providers"></div>
  <p class="muted small" id="loginMsg" role="status"></p>
</div>

<div id="app" hidden>
  <header class="top"><div class="in">
    <a class="brand" href="#/search" aria-label="JobRadar, accueil">Job<span>Radar</span></a>
    <nav aria-label="Navigation principale">
      <a href="#/search" data-nav="search">Recherche</a>
      <a href="#/profile" data-nav="profile">Mon profil</a>
      <a href="#/settings" data-nav="settings">Paramètres</a>
    </nav>
    <div class="chips" id="chips"></div>
  </div></header>
  <main id="view"></main>
</div>

<dialog id="dialog"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="pocketbase.umd.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
