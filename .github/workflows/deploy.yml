name: Deploy

# Construit l'image arm64 + amd64, la publie, puis le runner du Raspberry Pi redéploie.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lilyanlefevre/jobradar:latest

  deploy:
    needs: image
    runs-on: self-hosted # runner du Pi (connexion sortante uniquement)
    steps:
      - run: |
          cd "$HOME/JobRadar"
          git pull --ff-only
          docker compose --profile tunnel up -d --pull always
          docker image prune -f
