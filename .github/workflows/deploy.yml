name: Deploy

# Construit les images arm64 + amd64, les publie, puis le runner auto-hébergé redéploie.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { context: server, tag: jobradar }
          - { context: worker, tag: jobradar-worker }
    steps:
      - uses: actions/checkout@v4
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.name }}/${{ matrix.tag }}:latest

  deploy:
    needs: image
    runs-on: self-hosted # runner de la machine hôte (connexion sortante uniquement)
    steps:
      - run: |
          cd "$HOME/JobRadar"
          git pull --ff-only
          docker compose up -d --pull always # le profil "tunnel" s'active avec COMPOSE_PROFILES dans .env
          docker image prune -f
